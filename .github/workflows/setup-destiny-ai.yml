name: Destiny AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Destiny AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Install Node.js 20
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 4. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK components
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Install JavaScript dependencies
      - name: Install npm dependencies
        run: npm install

      # 7. Check React Native installation
      - name: Check React Native
        run: |
          node --version
          npm --version
          npx react-native --version

      # 8. Generate Gradle wrapper if missing
      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper missing. Generating it..."
            gradle wrapper \
              --gradle-version 8.13 \
              --distribution-type bin
          else
            echo "Gradle wrapper already exists."
          fi

      # 9. Make Gradle wrapper executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 10. Show Gradle version
      - name: Check Gradle
        working-directory: android
        run: ./gradlew --version

      # 11. Clean Android project
      - name: Clean Android build
        working-directory: android
        run: ./gradlew clean --no-daemon

      # 12. Build release APK
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # 13. Find generated APK
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-AI-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error