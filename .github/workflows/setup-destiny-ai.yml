name: Destiny AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Destiny AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: |
          npm install

      - name: Verify React Native
        run: |
          node --version
          npm --version
          npx react-native --version

      # Generate Gradle wrapper BEFORE trying to use android/gradlew
      - name: Create Gradle wrapper
        run: |
          cd android

          if [ -f gradlew ]; then
            echo "Gradle wrapper already exists."
          else
            echo "Gradle wrapper does not exist."
            echo "Generating Gradle 8.13 wrapper..."

            gradle wrapper \
              --gradle-version 8.13 \
              --distribution-type bin
          fi

          echo "Checking generated wrapper..."
          ls -la
          ls -la gradle/wrapper

      # Verify the wrapper exists
      - name: Verify Gradle wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew was not generated."
            echo "Android directory:"
            find android -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar is missing."
            exit 1
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: gradle-wrapper.properties is missing."
            exit 1
          fi

          echo "Gradle wrapper is complete."

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew
          ls -l android/gradlew

      - name: Check Gradle
        working-directory: android
        run: |
          ./gradlew --version

      - name: Clean Android project
        working-directory: android
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "======================================"
          echo "GENERATED APK FILES"
          echo "======================================"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-AI-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error