name: Build Destiny AI Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.destinyai --project-name destinyai .
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.destinyai"/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.destinyai"/' android/app/build.gradle
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Install known-good Flutter source
        run: |
          test -s lib/main_fixed.dart
          cp lib/main_fixed.dart lib/main.dart
          rm -f lib/main_fixed.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/media_studio_page.dart')
          s = p.read_text(encoding='utf-8')
          old = '''            ])),
          ),
        ])),
      )]),
    );'''
          new = '''            ])),
          ),
        ]),
      )]),
    );'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              print('Media Studio tail already repaired or pattern not present.')
          p.write_text(s, encoding='utf-8')
          Path('test/widget_test.dart').unlink(missing_ok=True)

          # The Supabase query result is already a typed List in the current SDK.
          # Removing the redundant runtime type check eliminates the analyzer warning.
          chat = Path('lib/screens/chat_page.dart')
          cs = chat.read_text(encoding='utf-8')
          cs = cs.replace('if (rows is List && rows.isNotEmpty) {', 'if (rows.isNotEmpty) {', 1)
          chat.write_text(cs, encoding='utf-8')
          PY

      - name: Format Dart source
        run: dart format lib

      - name: Static analysis
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="https://vihbsfrwnslnmheowkhy.supabase.co"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: destiny-ai-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
