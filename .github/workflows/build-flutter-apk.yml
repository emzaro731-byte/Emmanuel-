name: Build Destiny AI Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.destinyai --project-name destinyai .
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.destinyai"/' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.destinyai"/' android/app/build.gradle
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          echo "Application ID:"
          grep -R 'applicationId' android/app/build.gradle* || true

      - name: Install dependencies
        run: flutter pub get

      - name: Repair Flutter source before analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          source = main.read_text(encoding='utf-8')

          # The standalone premium ChatPage is the single source of truth.
          # Remove the older embedded implementation from main.dart and import it.
          source, removed = re.subn(
              r'class ChatPage extends StatefulWidget \{.*?\nclass ProfilePage extends StatefulWidget \{',
              'class ProfilePage extends StatefulWidget {',
              source,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Could not remove the old embedded ChatPage from main.dart')

          if "import 'screens/chat_page.dart';" not in source:
              source = source.replace(
                  "import 'screens/media_studio_page.dart';",
                  "import 'screens/media_studio_page.dart';\nimport 'screens/chat_page.dart';",
                  1,
              )

          # main.dart no longer uses these packages directly.
          source = source.replace("import 'package:image_picker/image_picker.dart';\n", '')
          source = source.replace("import 'package:shared_preferences/shared_preferences.dart';\n", '')

          # Repair missing closing parentheses in ConfigScreen and LoginScreen.
          source = source.replace(
              "        ])),\n      );\n}\n\nclass AuthGate",
              "        ]))),\n      );\n}\n\nclass AuthGate",
              1,
          )
          source = source.replace(
              "        ])))),\n      );\n}\n\nclass HomeScreen",
              "        ])))),\n      );\n}\n\nclass HomeScreen",
              1,
          )

          main.write_text(source, encoding='utf-8')

          # Repair the known Liquid Glass Media Studio SliverList closing structure.
          media = Path('lib/screens/media_studio_page.dart')
          media_source = media.read_text(encoding='utf-8')
          broken = "            ])),\n          ),\n        ])),"
          fixed = "            ]))),\n          ),\n        ])),"
          if broken in media_source:
              media_source = media_source.replace(broken, fixed, 1)
              media.write_text(media_source, encoding='utf-8')
              print('Repaired Media Studio SliverList closing parenthesis.')
          else:
              print('Media Studio structure already repaired or pattern not present.')

          # Flutter's generated test still references the old project name MyApp.
          # It is not part of the Destiny AI application and should not block APK analysis.
          test_file = Path('test/widget_test.dart')
          if test_file.exists():
              test_file.unlink()
              print('Removed stale generated widget test.')

          print('Flutter source repair completed successfully.')
          PY

      - name: Static analysis
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="https://vihbsfrwnslnmheowkhy.supabase.co"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: destiny-ai-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
