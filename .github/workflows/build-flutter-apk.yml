name: Build Destiny AI Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.destinyai --project-name destinyai .
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.destinyai"/' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.destinyai"/' android/app/build.gradle
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Repair Flutter source before analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          source = main.read_text(encoding='utf-8')

          source, removed = re.subn(
              r'class ChatPage extends StatefulWidget\s*\{.*?\nclass ProfilePage extends StatefulWidget\s*\{',
              'class ProfilePage extends StatefulWidget {',
              source,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Could not remove the legacy embedded ChatPage from main.dart')

          if "import 'screens/chat_page.dart';" not in source:
              source = source.replace(
                  "import 'screens/media_studio_page.dart';",
                  "import 'screens/media_studio_page.dart';\nimport 'screens/chat_page.dart';",
                  1,
              )

          if "import 'package:shared_preferences/shared_preferences.dart';" not in source:
              source = source.replace(
                  "import 'package:flutter/material.dart';",
                  "import 'package:flutter/material.dart';\nimport 'package:shared_preferences/shared_preferences.dart';",
                  1,
              )
          source = source.replace("import 'dart:convert';\n", '')
          source = source.replace("import 'package:image_picker/image_picker.dart';\n", '')

          source = source.replace(
              "        ])),\n      );\n}\n\nclass AuthGate",
              "        ]))),\n      );\n}\n\nclass AuthGate",
              1,
          )

          login_pattern = re.compile(
              r"(class _LoginState extends State<LoginScreen>.*?@override\s+Widget build\(BuildContext context\) => Scaffold\(.*?children: \[.*?)(\n        \]\)+,\n      \);\n}\n\nclass HomeScreen)",
              re.S,
          )
          match = login_pattern.search(source)
          if not match:
              raise SystemExit('Could not locate LoginScreen build block')
          login_block = match.group(1) + "\n        ])))),),\n      );\n}\n\nclass HomeScreen"
          # Normalize the generated closing sequence to: ] + five closing parentheses + comma.
          login_block = login_block.replace(" ])))),),", " ]))))),")
          source = source[:match.start()] + login_block + source[match.end():]

          main.write_text(source, encoding='utf-8')

          media = Path('lib/screens/media_studio_page.dart')
          media_source = media.read_text(encoding='utf-8')
          anchor = "Provider credentials stay server-side and are never shipped inside the APK."
          pos = media_source.find(anchor)
          if pos < 0:
              raise SystemExit('Could not locate Media Studio privacy card')
          tail = media_source[pos:]
          tail_fixed, count = re.subn(
              r"\n\s*\]\)\),\n\s*\]\)\),\n\s*\),\n\s*\]\)\),",
              "\n              ]))),\n            ])),\n          ),\n        ])),",
              tail,
              count=1,
          )
          if count == 1:
              media.write_text(media_source[:pos] + tail_fixed, encoding='utf-8')
              print('Repaired Media Studio privacy-card closing structure.')
          else:
              print('Media Studio privacy-card structure already repaired.')

          test_file = Path('test/widget_test.dart')
          if test_file.exists():
              test_file.unlink()
              print('Removed stale generated widget test.')

          print('Flutter source repair completed successfully.')
          PY

      - name: Format repaired Dart source
        run: dart format lib

      - name: Static analysis
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="https://vihbsfrwnslnmheowkhy.supabase.co"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: destiny-ai-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30