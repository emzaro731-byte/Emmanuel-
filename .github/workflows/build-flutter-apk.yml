name: Build Destiny AI Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_SUPABASE_URL: https://vihbsfrwnslnmheowkhy.supabase.co
  FLUTTER_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.destinyai --project-name destinyai .
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.destinyai"/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.destinyai"/' android/app/build.gradle
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Format source
        run: dart format --output=none --set-exit-if-changed lib

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$FLUTTER_SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${FLUTTER_SUPABASE_KEY:-sb_publishable_j8gV4-PeFte1RMgl759uQQ_KrM_3vzK}"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: destiny-ai-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
