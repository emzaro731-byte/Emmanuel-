name: Build Destiny AI Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.destinyai --project-name destinyai .
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.destinyai"/' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.destinyai"/' android/app/build.gradle
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          echo "Application ID:"
          grep -R 'applicationId' android/app/build.gradle* || true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply premium liquid glass chat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          chat = Path('lib/screens/chat_page.dart').read_text(encoding='utf-8').strip()
          source = main.read_text(encoding='utf-8')

          if "import 'screens/chat_page.dart';" not in source:
              source = source.replace(
                  "import 'screens/media_studio_page.dart';",
                  "import 'screens/media_studio_page.dart';\nimport 'screens/chat_page.dart';",
                  1,
              )

          pattern = r'class ChatPage extends StatefulWidget \{.*?\nclass ProfilePage extends StatefulWidget \{'
          replacement = chat + "\n\nclass ProfilePage extends StatefulWidget {"
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate the existing ChatPage block in lib/main.dart')

          main.write_text(updated, encoding='utf-8')
          print('Premium liquid glass chat applied successfully.')
          PY

      - name: Static analysis report
        run: |
          flutter analyze > analyze.log 2>&1 || true
          cat analyze.log

      - name: Build release APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="https://vihbsfrwnslnmheowkhy.supabase.co"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: destiny-ai-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
