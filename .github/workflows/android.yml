name: Destiny AI Clean APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Expo project
        run: |
          npx expo install --fix --non-interactive || true
          npx expo-doctor || true

      - name: Remove old generated Android project
        run: rm -rf android

      - name: Generate fresh Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Destiny AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-AI-Clean-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
