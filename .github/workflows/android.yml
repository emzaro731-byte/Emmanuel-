name: Destiny AI Android Build

on:
workflow_dispatch:

push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Destiny AI APK
runs-on: ubuntu-latest

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: npm

  - name: Install npm dependencies
    run: npm install

  - name: Check project files
    run: |
      echo "===== PROJECT FILES ====="
      ls -la

      echo "===== APP FILE ====="
      test -f App.tsx

      echo "===== ENTRY FILE ====="
      test -f index.js

      echo "===== APP CONFIG ====="
      test -f app.json

      echo "===== SUPABASE FILE ====="
      test -f lib/supabase.ts

      echo "SUCCESS: Required files found."

  - name: TypeScript check
    run: npx tsc --noEmit

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      yes | sdkmanager --licenses || true

      sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Check Android project
    run: |
      echo "===== ANDROID DIRECTORY ====="
      ls -la android

      echo "===== GRADLE WRAPPER ====="
      ls -la android/gradle/wrapper || true

  - name: Make Gradle executable
    run: |
      chmod +x android/gradlew

  - name: Check Gradle
    working-directory: android
    run: |
      ./gradlew --version

  - name: Clean Android project
    working-directory: android
    run: |
      ./gradlew clean --no-daemon --stacktrace

  - name: Build Release APK
    working-directory: android
    run: |
      ./gradlew assembleRelease \
        --no-daemon \
        --stacktrace

  - name: Find APK
    run: |
      echo "===== GENERATED APK ====="

      find android/app/build/outputs/apk \
        -type f \
        -name "*.apk" \
        -print

  - name: Upload Destiny AI APK
    uses: actions/upload-artifact@v4
    with:
      name: Destiny-AI-APK
      path: android/app/build/outputs/apk/release/*.apk
      if-no-files-found: error
      retention-days: 30