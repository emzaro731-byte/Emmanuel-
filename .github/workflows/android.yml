name: Destiny AI Android Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Destiny AI APK
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Node 20
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: npm

  - name: Setup Android
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Install npm dependencies
    run: npm install

  - name: Verify project
    run: |
      echo "===== PROJECT ====="
      pwd
      ls -la

      echo "===== REQUIRED FILES ====="
      test -f App.tsx
      test -f index.js
      test -f app.json
      test -f package.json
      test -f lib/supabase.ts

      echo "All required files found."

  - name: Install Gradle 8.13
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.13"

  - name: Generate Gradle wrapper
    working-directory: android
    run: |
      gradle wrapper \
        --gradle-version 8.13 \
        --distribution-type bin

      echo "===== WRAPPER ====="
      ls -la
      ls -la gradle/wrapper

  - name: Verify Gradle wrapper
    run: |
      test -f android/gradlew
      test -f android/gradlew.bat
      test -f android/gradle/wrapper/gradle-wrapper.jar
      test -f android/gradle/wrapper/gradle-wrapper.properties

      echo "Gradle wrapper verified."

  - name: Make Gradle executable
    run: chmod +x android/gradlew

  - name: TypeScript check
    run: npx tsc --noEmit

  - name: Generate debug keystore
    run: |
      mkdir -p android/app

      keytool -genkeypair \
        -v \
        -keystore android/app/debug.keystore \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=Android Debug,O=Android,C=US"

  - name: Verify debug keystore
    run: |
      test -f android/app/debug.keystore
      echo "Debug keystore created."

  - name: Check Gradle
    working-directory: android
    run: ./gradlew --version

  - name: Clean
    working-directory: android
    run: ./gradlew clean --no-daemon --stacktrace

  - name: Build Release APK
    working-directory: android
    run: ./gradlew assembleRelease --no-daemon --stacktrace

  - name: Find APK
    run: |
      echo "===== APK FILES ====="
      find android/app/build/outputs/apk \
        -type f \
        -name "*.apk" \
        -print

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Destiny-AI-APK
      path: android/app/build/outputs/apk/release/*.apk
      if-no-files-found: error
      retention-days: 30