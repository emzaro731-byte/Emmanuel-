name: Install Destiny AI Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/install-packages.yml

permissions:
  contents: write

jobs:
  install-packages:
    name: Install Packages and Create Package Lock
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # STEP 1: DOWNLOAD YOUR PROJECT
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # STEP 2: INSTALL NODE.JS
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -----------------------------
      # STEP 3: SHOW VERSIONS
      # -----------------------------
      - name: Check Node and npm
        run: |
          node --version
          npm --version

      # -----------------------------
      # STEP 4: INSTALL CURRENT PROJECT
      # -----------------------------
      - name: Install Existing Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # -----------------------------
      # STEP 5: INSTALL SUPABASE
      # -----------------------------
      - name: Install Supabase
        run: |
          npm install @supabase/supabase-js

      # -----------------------------
      # STEP 6: INSTALL ASYNC STORAGE
      # -----------------------------
      - name: Install AsyncStorage
        run: |
          npm install @react-native-async-storage/async-storage

      # -----------------------------
      # STEP 7: INSTALL URL POLYFILL
      # -----------------------------
      - name: Install URL Polyfill
        run: |
          npm install react-native-url-polyfill

      # -----------------------------
      # STEP 8: INSTALL VECTOR ICONS
      # -----------------------------
      - name: Install Vector Icons
        run: |
          npm install @expo/vector-icons

      # -----------------------------
      # STEP 9: INSTALL EXPO IMAGE PICKER
      # -----------------------------
      - name: Install Expo Image Picker
        run: |
          npx expo install expo-image-picker --npm

      # -----------------------------
      # STEP 10: INSTALL EXPO SPEECH
      # -----------------------------
      - name: Install Expo Speech
        run: |
          npx expo install expo-speech --npm

      # -----------------------------
      # STEP 11: INSTALL EXPO FILE SYSTEM
      # -----------------------------
      - name: Install Expo File System
        run: |
          npx expo install expo-file-system --npm

      # -----------------------------
      # STEP 12: UPDATE EXPO DEPENDENCIES
      # -----------------------------
      - name: Fix Expo Package Versions
        run: |
          npx expo install --fix --npm

      # -----------------------------
      # STEP 13: GENERATE PACKAGE LOCK
      # -----------------------------
      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only

      # -----------------------------
      # STEP 14: CHECK EXPO PROJECT
      # -----------------------------
      - name: Run Expo Doctor
        run: |
          npx expo-doctor

      # -----------------------------
      # STEP 15: SHOW IMPORTANT FILES
      # -----------------------------
      - name: Check Project Files
        run: |
          echo "=============================="
          echo "DESTINY AI PACKAGE INSTALLATION"
          echo "=============================="

          ls -la

          echo ""
          echo "Checking files..."

          test -f package.json
          echo "✅ package.json found"

          test -f package-lock.json
          echo "✅ package-lock.json found"

          echo ""
          echo "Installed packages:"
          npm list --depth=0 || true

      # -----------------------------
      # STEP 16: COMMIT CHANGES
      # -----------------------------
      - name: Commit package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          git diff --cached --quiet || git commit -m "Install Destiny AI dependencies automatically"

          git push