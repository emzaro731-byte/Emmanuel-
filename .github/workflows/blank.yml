name: Build ChatGPT Clone APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Remove old dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Check React Native
        run: |
          node -v
          npm -v
          npm ls react react-native --depth=0

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Clean Android
        working-directory: android
        run: ./gradlew clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Clone-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error