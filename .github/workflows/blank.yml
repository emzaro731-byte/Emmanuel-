name: Build Destiny AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Download your GitHub project
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java required for Android builds
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Automatically install ALL dependencies from package.json
      - name: Install dependencies
        run: |
          echo "Installing npm dependencies..."
          npm install

          echo "Installing required React Native packages..."
          npm install \
            @react-native-async-storage/async-storage \
            @react-native-clipboard/clipboard \
            @supabase/supabase-js \
            react-native-url-polyfill

      # Install Android SDK components
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Make Gradle executable
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      # Show project information for debugging
      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== ANDROID FOLDER ====="
          ls -la android

          echo "===== PACKAGE.JSON ====="
          cat package.json

      # Clean previous Android build
      - name: Clean Android project
        working-directory: android
        run: |
          ./gradlew clean

      # Build the DEBUG APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      # Show generated APK files
      - name: Find APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find android/app/build/outputs -type f | sort

      # Upload APK so you can download it from GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30