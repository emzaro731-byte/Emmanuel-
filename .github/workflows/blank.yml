name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show versions
        run: |
          node --version
          npm --version
          java -version

      - name: Remove old dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm install

      - name: Verify React Native
        run: |
          node -p "require('react-native/package.json').version"
          node -p "require('react/package.json').version"

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Clean Android build
        working-directory: android
        run: |
          ./gradlew clean

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             ChatGPTClone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTClone-APK
          path: ChatGPTClone.apk
          if-no-files-found: error