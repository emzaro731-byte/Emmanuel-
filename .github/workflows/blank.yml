name: Install Destiny AI Dependencies

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/install-dependencies.yml"

permissions:
  contents: write

jobs:
  install-dependencies:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT PROJECT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. INSTALL NODE
      # ==========================================
      # No npm cache here because package-lock.json
      # may not exist yet.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ==========================================
      # 3. CHECK NODE
      # ==========================================
      - name: Check Node and npm
        run: |
          node --version
          npm --version

      # ==========================================
      # 4. CREATE/UPDATE PACKAGE LOCK
      # ==========================================
      - name: Install existing project dependencies
        run: |
          npm install

      # ==========================================
      # 5. INSTALL SUPABASE
      # ==========================================
      - name: Install Supabase
        run: |
          npm install @supabase/supabase-js

      # ==========================================
      # 6. INSTALL ASYNC STORAGE
      # ==========================================
      - name: Install AsyncStorage
        run: |
          npm install @react-native-async-storage/async-storage

      # ==========================================
      # 7. INSTALL URL POLYFILL
      # ==========================================
      - name: Install URL Polyfill
        run: |
          npm install react-native-url-polyfill

      # ==========================================
      # 8. INSTALL VECTOR ICONS
      # ==========================================
      - name: Install Expo Vector Icons
        run: |
          npm install @expo/vector-icons

      # ==========================================
      # 9. INSTALL BASE64 ARRAYBUFFER
      # ==========================================
      - name: Install Base64 ArrayBuffer
        run: |
          npm install base64-arraybuffer

      # ==========================================
      # 10. INSTALL EXPO IMAGE PICKER
      # ==========================================
      - name: Install Expo Image Picker
        run: |
          npx expo install expo-image-picker

      # ==========================================
      # 11. INSTALL EXPO SPEECH
      # ==========================================
      - name: Install Expo Speech
      run: |
          npx expo install expo-speech

      # ==========================================
      # 12. INSTALL EXPO FILE SYSTEM
      # ==========================================
      - name: Install Expo File System
        run: |
          npx expo install expo-file-system

      # ==========================================
      # 13. INSTALL EXPO CLIPBOARD
      # ==========================================
      - name: Install Expo Clipboard
        run: |
          npx expo install expo-clipboard

      # ==========================================
      # 14. FIX EXPO DEPENDENCY VERSIONS
      # ==========================================
      - name: Fix Expo dependencies
        run: |
          npx expo install --fix

      # ==========================================
      # 15. REGENERATE LOCKFILE
      # ==========================================
      - name: Generate package-lock.json
        run: |
          npm install

      # ==========================================
      # 16. VERIFY LOCKFILE
      # ==========================================
      - name: Verify package-lock.json
        run: |
          test -f package-lock.json
          echo "✅ package-lock.json exists"
          ls -lh package-lock.json

      # ==========================================
      # 17. RUN EXPO DOCTOR
      # ==========================================
      - name: Run Expo Doctor
        run: |
          npx expo-doctor

      # ==========================================
      # 18. VERIFY IMPORTANT PACKAGES
      # ==========================================
      - name: Verify installed packages
        run: |
          npm list \
            @supabase/supabase-js \
            @react-native-async-storage/async-storage \
            react-native-url-polyfill \
            @expo/vector-icons \
            expo-image-picker \
            expo-speech \
            expo-file-system \
            expo-clipboard \
            base64-arraybuffer \
            --depth=0

      # ==========================================
      # 19. SHOW PACKAGE LOCK
      # ==========================================
      - name: Check package files
        run: |
          echo "======================================"
          echo "DESTINY AI DEPENDENCIES"
          echo "======================================"

          echo ""
          echo "package.json:"
          test -f package.json
          echo "✅ Found"

          echo ""
          echo "package-lock.json:"
          test -f package-lock.json
          echo "✅ Found"

      # ==========================================
      # 20. COMMIT CHANGES
      # ==========================================
      - name: Commit package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "Install Destiny AI dependencies"
            git push
          fi