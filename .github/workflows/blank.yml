name: Destiny AI - Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Destiny AI APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # 2. NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      # ==========================================
      # 3. NODE VERSION
      # ==========================================
      - name: Check Node and npm
        run: |
          echo "======================================"
          echo "NODE"
          echo "======================================"

          node --version
          npm --version

      # ==========================================
      # 4. CHECK EXPO TOKEN
      # ==========================================
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ EXPO_TOKEN is missing."
            echo ""
            echo "GitHub → Settings → Secrets and variables → Actions"
            echo ""
            echo "Create repository secret:"
            echo "EXPO_TOKEN"
            echo ""
            exit 1
          fi

          echo "✅ EXPO_TOKEN is available"

      # ==========================================
      # 5. EXPO + EAS
      # ==========================================
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ==========================================
      # 6. EAS VERSION
      # ==========================================
      - name: Check EAS CLI
        run: |
          eas --version

      # ==========================================
      # 7. VERIFY EXPO ACCOUNT
      # ==========================================
      - name: Verify Expo account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Checking Expo account..."
          eas whoami

      # ==========================================
      # 8. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci

      # ==========================================
      # 9. CHECK PROJECT FILES
      # ==========================================
      - name: Check project files
        run: |
          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          test -f package.json
          echo "✅ package.json"

          test -f package-lock.json
          echo "✅ package-lock.json"

          test -f eas.json
          echo "✅ eas.json"

          if [ -f app.json ]; then
            echo "✅ app.json"
          elif [ -f app.config.js ]; then
            echo "✅ app.config.js"
          elif [ -f app.config.ts ]; then
            echo "✅ app.config.ts"
          else
            echo "❌ Expo app configuration not found"
            exit 1
          fi

      # ==========================================
      # 10. VERIFY EAS CONFIGURATION
      # ==========================================
      - name: Verify EAS configuration
        run: |
          echo "======================================"
          echo "EAS CONFIGURATION"
          echo "======================================"

          eas config \
            --platform android \
            --profile preview \
            --non-interactive

      # ==========================================
      # 11. CHECK EAS PROJECT
      # ==========================================
      - name: Check EAS project
        run: |
          echo "======================================"
          echo "EAS PROJECT"
          echo "======================================"

          eas project:info

      # ==========================================
      # 12. SHOW BUILD CONFIG
      # ==========================================
      - name: Show eas.json
        run: |
          echo "======================================"
          echo "eas.json"
          echo "======================================"

          cat eas.json

      # ==========================================
      # 13. EXPO DOCTOR
      # ==========================================
      - name: Run Expo Doctor
        run: |
          echo "Running Expo Doctor..."
          npx expo-doctor

      # ==========================================
      # 14. BUILD APK
      # ==========================================
      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "======================================"
          echo "DESTINY AI APK BUILD"
          echo "======================================"

          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait

      # ==========================================
      # 15. SUCCESS
      # ==========================================
      - name: Build submitted
        run: |
          echo ""
          echo "======================================"
          echo "✅ DESTINY AI APK BUILD SUBMITTED"
          echo "======================================"
          echo ""
          echo "EAS is building your Android APK."
          echo ""
          echo "Check your Expo dashboard for:"
          echo "• Build progress"
          echo "• Build logs"
          echo "• APK download"
          echo ""
          echo "======================================"