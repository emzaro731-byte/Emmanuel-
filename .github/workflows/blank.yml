name: Build Destiny AI APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Node
        run: |
          node --version
          npm --version

      - name: Check project files
        run: |
          test -f package.json
          test -f app.json
          test -f babel.config.js
          test -f App.tsx || test -f App.js

      - name: Install npm dependencies
        run: npm install

      - name: Install Expo compatible packages
        run: |
          npx expo install \
            @supabase/supabase-js \
            @react-native-async-storage/async-storage \
            react-native-url-polyfill \
            base64-arraybuffer \
            expo-image-picker \
            expo-file-system \
            expo-speech \
            expo-constants \
            expo-asset \
            expo-font \
            expo-keep-awake

      - name: Verify Expo project
        run: |
          npx expo config --type public

      - name: Run Expo Doctor
        run: |
          npx expo-doctor

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --no-install

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Find APK
        run: |
          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-AI-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error