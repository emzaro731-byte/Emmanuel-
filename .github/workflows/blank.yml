name: Install Destiny AI Dependencies

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths:
      - "package.json"
      - ".github/workflows/install-dependencies.yml"

permissions:
  contents: write

jobs:
  install-dependencies:

    runs-on: ubuntu-latest

    steps:

      # Download your GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Show Node and npm versions
      - name: Check versions
        run: |
          node --version
          npm --version

      # Install normal npm dependencies
      - name: Install Supabase and React Native packages
        run: |
          npm install \
            @supabase/supabase-js \
            @react-native-async-storage/async-storage \
            react-native-url-polyfill \
            @expo/vector-icons \
            base64-arraybuffer

      # Install Expo packages using Expo-compatible versions
      - name: Install Expo packages
        run: |
          npx expo install \
            expo-image-picker \
            expo-speech \
            expo-file-system \
            expo-clipboard

      # Fix Expo SDK dependency versions automatically
      - name: Fix Expo dependency versions
        run: |
          npx expo install --fix --npm

      # Make sure package-lock.json exists and is updated
      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only

      # Check the Expo project
      - name: Run Expo Doctor
        run: |
          npx expo-doctor

      # Save updated package files back to GitHub
      - name: Commit updated dependencies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          git diff --cached --quiet || git commit -m "Update Destiny AI dependencies automatically"

          git push