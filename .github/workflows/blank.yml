name: Build Destiny AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo "===== PACKAGE.JSON ====="
          cat package.json

      - name: Install npm dependencies
        run: npm install

      - name: Install Expo packages
        run: |
          npx expo install @supabase/supabase-js @react-native-async-storage/async-storage react-native-url-polyfill expo-image-picker expo-speech

      - name: Check Expo
        run: npx expo --version

      - name: Check dependencies
        run: |
          npm list @supabase/supabase-js || true
          npm list @react-native-async-storage/async-storage || true
          npm list react-native-url-polyfill || true
          npm list expo-image-picker || true
          npm list expo-speech || true

      - name: Expo Doctor
        run: npx expo-doctor
        continue-on-error: true

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-AI-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error