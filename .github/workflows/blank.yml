name: Build Destiny AI APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Show project files
        run: |
          echo "Repository files:"
          ls -la
          echo ""
          echo "Searching for Gradle files:"
          find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi


      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          elif [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            gradle assembleRelease --no-daemon
          else
            echo "ERROR: No Gradle project found in repository root."
            echo "Make sure settings.gradle and build.gradle are uploaded to GitHub."
            exit 1
          fi


      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-AI-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error