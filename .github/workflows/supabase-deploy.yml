name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Install a fixed Supabase CLI version
      - name: Install Supabase CLI
        run: |
          npm install --global supabase@latest

      # 4. Check CLI
      - name: Check Supabase CLI
        run: |
          supabase --version

      # 5. Verify authentication variables exist
      - name: Check Supabase configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "ERROR: SUPABASE_PROJECT_ID is missing."
            exit 1
          fi

          echo "Supabase credentials detected."

      # 6. Deploy all Edge Functions
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy \
            --project-ref "$SUPABASE_PROJECT_ID"