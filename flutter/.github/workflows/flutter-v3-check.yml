name: Destiny AI Flutter V3 Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter/**'
    branches:
      - 'upgrade/destiny-ai-flutter-v3'
  pull_request:
    paths:
      - 'flutter/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: destiny-ai-flutter-v3-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
