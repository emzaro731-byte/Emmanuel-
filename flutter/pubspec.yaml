name: destiny_ai
description: Destiny AI mobile app built with Flutter and Supabase.
publish_to: "none"
version: 2.0.0+21

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  http: ^1.5.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
